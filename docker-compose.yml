services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DynamicHr!Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: ./backend/DynamicEmployeeApi
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=DynamicHr;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DynamicHr!Passw0rd};TrustServerCertificate=True;Encrypt=False
      Cors__AllowedOrigins: http://localhost:5173
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5154:8080"

  seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/seed-scripts/docker-seed.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DynamicHr!Passw0rd}
      SQL_SERVER: sqlserver
      SQL_PORT: "1433"
      SQL_DATABASE: DynamicHr
    volumes:
      - ./scripts:/seed-scripts:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
