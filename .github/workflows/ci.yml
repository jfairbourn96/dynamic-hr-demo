name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend build, test, and coverage
    runs-on: windows-latest

    defaults:
      run:
        working-directory: backend/DynamicEmployeeApi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DynamicEmployeeApi.sln

      - name: Build
        run: dotnet build DynamicEmployeeApi.sln --configuration Release --no-restore

      - name: Application unit tests with coverage
        run: dotnet test Dynamic.Employees.Application.UnitTests\Dynamic.Employees.Application.UnitTests.csproj --configuration Release --no-build --settings coverlet.runsettings --results-directory ../../artifacts/coverage/raw/application --collect "XPlat Code Coverage"

      - name: Data unit tests with coverage
        run: dotnet test Dynamic.Employees.Data.UnitTests\Dynamic.Employees.Data.UnitTests.csproj --configuration Release --no-build --settings coverlet.runsettings --results-directory ../../artifacts/coverage/raw/data --collect "XPlat Code Coverage"

      - name: API unit tests with coverage
        run: dotnet test EmployeeApi.UnitTests\EmployeeApi.UnitTests.csproj --configuration Release --no-build --settings coverlet.runsettings --results-directory ../../artifacts/coverage/raw/api --collect "XPlat Code Coverage"

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.10
        with:
          reports: 'artifacts/coverage/raw/**/coverage.cobertura.xml'
          targetdir: 'artifacts/coverage/report'
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'
          assemblyfilters: '+Dynamic.Employees.*;+EmployeeApi;-*.UnitTests;-*.IntegrationTests;-*.Tests'

      - name: Publish coverage summary
        shell: pwsh
        run: Get-Content artifacts/coverage/report/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY
        working-directory: .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/report

  backend-sqlserver-integration:
    name: Backend SQL Server integration tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/DynamicEmployeeApi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DynamicEmployeeApi.sln

      - name: Build integration tests
        run: dotnet build Dynamic.Employees.Data.IntegrationTests/Dynamic.Employees.Data.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run SQL Server integration tests
        run: dotnet test Dynamic.Employees.Data.IntegrationTests/Dynamic.Employees.Data.IntegrationTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint and build
    runs-on: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

